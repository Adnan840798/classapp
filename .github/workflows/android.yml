name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  build-apk:
    name: Build & release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ─────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── 3. Android SDK ─────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 4. Java (required by Gradle / Android build tools) ─────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      # ── 5. Install npm deps ─────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 6. Sync Capacitor (copies web assets + updates native project) ──────
      #       We do NOT run `next build` here — the APK loads the live Vercel URL.
      #       We only need `npx cap sync android` to refresh native config.
      - name: Sync Capacitor
        run: npx cap sync android
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      # ── 7. Make gradlew executable ──────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 8. Decode keystore from GitHub secret ──────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/classapp-release.keystore

      # ── 8b. Write google-services.json if provided as a secret ──────────────
      - name: Write google-services.json
        if: "${{ secrets.GOOGLE_SERVICES_JSON != '' }}"
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json

      # ── 9. Build release APK ────────────────────────────────────────────────
      - name: Build release APK
        working-directory: android
        run: |
          java -version
          echo "JAVA_HOME is $JAVA_HOME"
          ./gradlew assembleRelease \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/app/classapp-release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      # ── 10. Rename APK ──────────────────────────────────────────────────────
      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/classapp0.apk
          echo "APK_PATH=android/app/build/outputs/apk/release/classapp0.apk" >> $GITHUB_ENV
          echo "APK_NAME=classapp0.apk" >> $GITHUB_ENV

      # ── 11. Upload APK as workflow artifact ─────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
          retention-days: 30

      # ── 12. Create a GitHub Release with the APK attached ───────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "ClassApp APK #${{ github.run_number }}"
          body: |
            🤖 Automated APK build from commit ${{ github.sha }}

            **Install:** Download the `.apk` file below and open it on your Android device.
            *(Enable "Install from unknown sources" in Settings → Security if prompted)*
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
